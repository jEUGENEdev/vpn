---
- name: Deploy LineVPN (Debian 12/13 or Ubuntu 24.04/26.04)
  hosts: vpn
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate platform and configuration
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - ansible_facts.architecture == 'x86_64'
          - >-
            (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version in ['12', '13'])
            or (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version in ['24.04', '26.04'])
          - vpn_public_ip | length > 0
        fail_msg: Use a supported Linux amd64 host, a public IP and an optional 16-72 byte admin password.
      no_log: true
    - name: Install system packages
      ansible.builtin.apt:
        # An unprivileged SSH user needs setfacl to run checks as linevpn.
        name: [ca-certificates, ufw, acl]
        state: present
        update_cache: true
        lock_timeout: 600
  tasks:
    - name: Create service account
      ansible.builtin.user:
        name: linevpn
        system: true
        home: /var/lib/linevpn
        create_home: false
        shell: /usr/sbin/nologin
    - name: Create configuration directory read-only for service
      ansible.builtin.file:
        path: /etc/linevpn
        state: directory
        owner: root
        group: linevpn
        mode: '0750'
    - name: Create protected state directory
      ansible.builtin.file:
        path: /var/lib/linevpn
        state: directory
        owner: linevpn
        group: linevpn
        mode: '0700'
    - name: Install executables
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - {src: "{{ vpn_server_binary }}", dest: /usr/local/bin/linevpn-server}
        - {src: "{{ vpn_keygen_binary }}", dest: /usr/local/bin/linevpn-keygen}
      notify: Restart LineVPN
    - name: Generate REALITY keys and pinned API certificate once
      ansible.builtin.command:
        argv: [/usr/local/bin/linevpn-keygen, -dir, /etc/linevpn, -ip, "{{ vpn_public_ip }}", -reality-target, "{{ vpn_reality_target | default('www.microsoft.com') }}"]
        creates: /etc/linevpn/server.json
      register: vpn_bootstrap
      no_log: true
      notify: Restart LineVPN
    - name: Save public API identity without enrollment key
      ansible.builtin.copy:
        content: "{{ vpn_bootstrap.stdout | trim }}\n"
        dest: /etc/linevpn/bootstrap.txt
        owner: root
        group: linevpn
        mode: '0640'
      when: vpn_bootstrap.changed
      no_log: true
    - name: Check for an existing administrator credential
      ansible.builtin.stat:
        path: /etc/linevpn/admin-password
      register: vpn_admin_file
    - name: Upgrade API certificate SANs while retaining the pinned key
      ansible.builtin.command:
        argv: [/usr/local/bin/linevpn-keygen, -dir, /etc/linevpn, -ip, "{{ vpn_public_ip }}", -ensure-admin-san]
      register: vpn_cert_upgrade
      changed_when: vpn_cert_upgrade.stdout | length > 0
      no_log: true
    - name: Require a known admin password on first deployment
      ansible.builtin.assert:
        that: vpn_admin_file.stat.exists or vpn_admin_password | length > 0
        fail_msg: Set VPN_ADMIN_PASSWORD or vault_admin_password for the first deployment.
      no_log: true
    - name: Hash supplied admin password with byte-length validation
      ansible.builtin.command:
        argv: [/usr/local/bin/linevpn-keygen, -hash-admin-password]
        stdin: "{{ vpn_admin_password }}"
        stdin_add_newline: false
      register: vpn_admin_hash
      when: vpn_admin_password | length > 0
      changed_when: false
      no_log: true
    - name: Install configured admin password hash
      ansible.builtin.copy:
        content: "{{ vpn_admin_hash.stdout | trim }}"
        dest: /etc/linevpn/admin-password
        owner: root
        group: linevpn
        mode: '0640'
      when: vpn_admin_password | length > 0
      no_log: true
      notify: Restart LineVPN
    - name: Migrate legacy plaintext administrator password
      ansible.builtin.command:
        argv: [/usr/local/bin/linevpn-keygen, -migrate-admin-password, /etc/linevpn/admin-password]
      register: vpn_admin_migration
      changed_when: "'changed' in vpn_admin_migration.stdout"
      no_log: true
      notify: Restart LineVPN
    - name: Make configuration files read-only for service
      ansible.builtin.file:
        path: "/etc/linevpn/{{ item }}"
        owner: root
        group: linevpn
        mode: '0640'
      loop: [server.json, admin-password, bootstrap.txt, api-cert.pem, api-key.pem]
    - name: Validate server configuration
      become_user: linevpn
      ansible.builtin.command: /usr/local/bin/linevpn-server -config /etc/linevpn/server.json -check
      changed_when: false
    - name: Install systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
      loop: [linevpn.service, linevpn-renew.service, linevpn-renew.timer]
      notify: Restart LineVPN
    - name: Allow SSH before enabling firewall
      community.general.ufw:
        rule: allow
        port: "{{ vpn_ssh_port | default(ansible_port | default(22)) }}"
        proto: tcp
    - name: Expose only encrypted public services
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      # XHTTP uses TCP; forwarded application UDP is carried inside this tunnel.
      loop: ['443', '8443']
    - name: Deny unsolicited inbound connections
      community.general.ufw:
        default: deny
        direction: incoming
        state: enabled
    - name: Enable services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: [linevpn.service, linevpn-renew.timer]
    - name: Apply changes before readiness check
      ansible.builtin.meta: flush_handlers
    - name: Check API listener
      ansible.builtin.wait_for:
        port: 8443
        host: 127.0.0.1
        timeout: 30
    - name: Fetch public API identity over SSH (full profile is issued by admin)
      ansible.builtin.fetch:
        src: /etc/linevpn/bootstrap.txt
        dest: "{{ playbook_dir }}/generated/{{ inventory_hostname }}-bootstrap.txt"
        flat: true
    - name: Fetch API certificate for administrator trust setup
      ansible.builtin.fetch:
        src: /etc/linevpn/api-cert.pem
        dest: "{{ playbook_dir }}/generated/{{ inventory_hostname }}-api-cert.pem"
        flat: true
    - name: Read configured public REALITY identity for external TLS verification
      become_user: linevpn
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import json; print(json.load(open('/etc/linevpn/server.json'))['transport']['sni'])"
      register: vpn_runtime_sni
      changed_when: false
    - name: Save public REALITY identity on the deployment controller
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        content: "{{ vpn_runtime_sni.stdout | trim }}\n"
        dest: "{{ playbook_dir }}/generated/{{ inventory_hostname }}-reality-sni.txt"
        mode: '0600'
  handlers:
    - name: Restart LineVPN
      ansible.builtin.systemd:
        name: linevpn.service
        state: restarted
        daemon_reload: true

