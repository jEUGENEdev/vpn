name: Test and build current installers
on:
  push:
    branches: [main]
    paths-ignore: ['installers/**', 'docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: ./.github/workflows/security.yml
  test:
    needs: security
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.27.4', cache: true}
      - run: bash scripts/check.sh go
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: python3 -m pip install -r tools/checks/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24'}
      - name: Test client UI and capture layouts
        run: |
          npm ci --prefix tools/ui-tests --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/desktop --ignore-scripts --no-audit --no-fund
          tools/ui-tests/node_modules/.bin/playwright install --with-deps chromium
          bash scripts/check.sh portable
          bash scripts/check.sh desktop
          bash scripts/check.sh ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: ui-previews, path: 'build/ui-*.png'}
      - run: scripts/build-server.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-binaries
          path: build/*-linux-amd64
          if-no-files-found: error
  android:
    timeout-minutes: 35
    needs: test
    runs-on: ubuntu-24.04
    env:
      LINEVPN_ANDROID_VARIANT: debug
      LINEVPN_ANDROID_TEST_ONLY: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && '1' || '0' }}
      ANDROID_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_STORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEY_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Reserve space on the disposable Android runner
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.27.4', cache: true}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '17'}
      - name: Restore the existing Android signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          encoded = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          if not encoded:
              raise SystemExit('Configure the existing Android signing key; a new debug key cannot update installed clients')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'linevpn-signing.keystore'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(base64.b64decode(encoded, validate=True))
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'ANDROID_KEYSTORE={target}\n')
          PY
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: {gradle-version: '8.11.1', cache-provider: basic, cache-read-only: false}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: android_go_cache
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-android-go1.27.4-ndk28-${{ hashFiles('go.sum') }}
      - run: scripts/package-android.sh
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.android_go_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-android-go1.27.4-ndk28-${{ hashFiles('go.sum') }}
      - name: Build Android instrumentation test
        run: cd apps/android && gradle --no-daemon assembleDebugAndroidTest
      - name: Release build-only SDK files before emulator
        run: rm -rf "$ANDROID_HOME/ndk/28.0.13004108"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: scripts/test-android.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-native-check
          path: |
            build/android-*.txt
            build/android-native.png
      - name: Collect explicitly marked preview APK
        run: |
          mkdir -p build/installers
          vpn_version="$(python3 scripts/package_version.py)"
          if [[ "$LINEVPN_ANDROID_TEST_ONLY" != 1 ]]; then python3 scripts/verify_android_update.py apps/android/app/build/outputs/apk/debug/app-debug.apk; fi
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "build/installers/Сеть-$vpn_version-android-preview.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-android
          path: build/installers/*.apk
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/linevpn-signing.keystore"
  windows:
    timeout-minutes: 25
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.27.4', cache: true}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/desktop/package-lock.json}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: {dotnet-version: '8.0.x'}
      - name: Verify Windows socket ownership
        run: go test ./internal/owner
      - run: ./scripts/package-windows.ps1
      - name: Verify service stop, crash and uninstall network recovery
        run: ./scripts/test-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-native-check
          path: |
            build/windows-native.txt
            build/windows-install.log
            build/windows-update.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-windows
          path: build/*.msi
          if-no-files-found: error
  macos:
    timeout-minutes: 25
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: macos-15-intel}
          - {arch: arm64, runner: macos-26}
    env:
      LINEVPN_MACOS_SIGNING: preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.27.4', cache: true}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/desktop/package-lock.json}
      - name: Verify macOS socket ownership
        run: go test ./internal/owner
      - run: scripts/package-macos.sh ${{ matrix.arch }}
      - name: Verify service lifecycle and network recovery on matching host architecture
        if: (matrix.arch == 'arm64' && runner.arch == 'ARM64') || (matrix.arch == 'amd64' && runner.arch == 'X64')
        run: scripts/test-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-native-check-${{ matrix.arch }}
          path: |
            build/macos-native.txt
            build/macos-signing.txt
            build/macos-gui.txt
            build/macos-install.log
            build/macos-service.log
            build/macos-package.log
            build/macos-network.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-macos-${{ matrix.arch }}
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error
  publish-current:
    timeout-minutes: 15
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: 'installer-*', path: build/installers, merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: ui-previews, path: docs/screenshots}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: android-native-check, path: build/native-preview}
      - run: cp build/native-preview/android-native.png docs/screenshots/android-native.png
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify and publish complete installer set
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 scripts/publish-installers.py build/installers installers/current
          git lfs install --local
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installers/current docs/screenshots
          git commit -m 'build: update current preview installers [skip ci]' || exit 0
          git push origin "HEAD:$TARGET_BRANCH"
