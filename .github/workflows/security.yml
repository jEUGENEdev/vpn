name: Security checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version: '1.27.4', cache: true}
      - name: Install pinned analysis tools
        run: bash tools/checks/install.sh
      - name: Check workflows, secrets and dependencies
        run: bash scripts/check-security.sh
