name: Deploy VPN server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/security.yml'
      - 'scripts/check-security.sh'
      - 'tools/checks/**'
      - '.gitleaks.toml'
      - 'deploy/**'
      - 'scripts/*deploy*.py'
      - 'scripts/deploy-*.sh'
      - 'scripts/*deploy*.ps1'
      - 'scripts/build-server.sh'
      - 'scripts/package-server.sh'
      - 'deploy.sh'
      - 'deploy.bat'
      - 'cmd/linevpn-server/**'
      - 'cmd/linevpn-keygen/**'
      - 'internal/server/**'
      - 'internal/store/**'
      - 'internal/model/**'
      - 'internal/policy/**'
      - 'internal/secure/**'
      - 'internal/transport/**'
      - 'internal/ui/admin/**'
      - 'internal/ui/ui.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/security.yml'
      - 'scripts/check-security.sh'
      - 'tools/checks/**'
      - '.gitleaks.toml'
      - 'deploy/**'
      - 'scripts/*deploy*.py'
      - 'scripts/deploy-*.sh'
      - 'scripts/*deploy*.ps1'
      - 'scripts/build-server.sh'
      - 'scripts/package-server.sh'
      - 'deploy.sh'
      - 'deploy.bat'
      - 'cmd/linevpn-server/**'
      - 'cmd/linevpn-keygen/**'
      - 'internal/server/**'
      - 'internal/store/**'
      - 'internal/model/**'
      - 'internal/policy/**'
      - 'internal/secure/**'
      - 'internal/transport/**'
      - 'internal/ui/admin/**'
      - 'internal/ui/ui.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: linevpn-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yml

  validate:
    name: Validate deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: python -m pip install -r deploy/requirements.txt
      - run: ansible-galaxy collection install -r deploy/ansible/requirements.yml
      - run: python scripts/test-deploy-actions.py
      - run: bash -n deploy.sh scripts/deploy-bootstrap.sh && python scripts/test-deploy-manual.py
      - run: python -m pip install paramiko==5.1.0
      - run: python scripts/test-deploy-ssh.py
      - run: python scripts/test-deploy-security.py
      - name: Check Ansible playbook
        working-directory: deploy/ansible
        run: ansible-playbook -i inventory.example.ini deploy.yml --syntax-check

  validate-windows:
    name: Validate native Windows deployment launcher
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.27.4', cache: true}
      - name: Check PowerShell and source packaging
        shell: powershell
        run: ./scripts/test-deploy-windows.ps1

  validate-macos:
    name: Validate macOS deployment launcher
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - name: Verify deployment launcher with the macOS system Bash
        env:
          TEST_BASH: /bin/bash
        run: |
          python3 scripts/test-deploy-manual.py
          python3 scripts/test-deploy-security.py

  deploy:
    name: Deploy from main
    needs: [security, validate, validate-windows, validate-macos]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Check required repository secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
        run: python3 scripts/deploy-actions.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.27.4', cache: true}
      - name: Test server and transport
        run: go test -race ./internal/policy ./internal/secure ./internal/server ./internal/transport
      - name: Build server on the runner
        run: bash scripts/package-server.sh
      - name: Save verified manual deployment bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vpn-server-bundle
          path: build/linevpn-server-bundle.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass
          python -m pip install -r deploy/requirements.txt
          ansible-galaxy collection install -r deploy/ansible/requirements.yml
      - name: Deploy and verify public listeners
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
          ANSIBLE_SSH_PASSWORD_MECHANISM: sshpass
        run: |
          install -d -m 700 "$RUNNER_TEMP/linevpn-ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/linevpn-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/linevpn-ssh/known_hosts"
          cd deploy/ansible
          ansible-playbook -i inventory.github.yml deploy.yml
          cd ../..
          python scripts/deploy-actions.py --certificate deploy/ansible/generated/vpn1-api-cert.pem --reality-sni "$(cat deploy/ansible/generated/vpn1-reality-sni.txt)"
      - name: Save client bootstrap and public certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vpn-client-bootstrap
          path: |
            deploy/ansible/generated/*-bootstrap.txt
            deploy/ansible/generated/*-api-cert.pem
          if-no-files-found: error
          retention-days: 14
      - name: Remove SSH session files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/linevpn-ssh"
