name: Code checks
on:
  push:
    branches: [main]
    paths-ignore: ['installers/**', 'docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: ./.github/workflows/security.yml
  test:
    needs: security
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.27.4', cache: true}
      - run: bash scripts/check.sh go
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: python3 -m pip install -r tools/checks/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24'}
      - name: Test client UI and capture layouts
        run: |
          npm ci --prefix tools/ui-tests --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/desktop --ignore-scripts --no-audit --no-fund
          tools/ui-tests/node_modules/.bin/playwright install --with-deps chromium
          bash scripts/check.sh portable
          bash scripts/check.sh desktop
          bash scripts/check.sh ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: ui-previews, path: 'build/ui-*.png'}
